:root{
  --bg:#f3f4f6;
  --surface:#ffffff;
  --field:#f9fafb;
  --field-hover:#f1f3f5;
  --text:#12131a;
  --muted:#9ca3af;
  --sub:#6b7280;
  --edge:#eef0f3;
  --edge-2:#e5e7eb;
  --accent:#12aaff;
  --accent-press:#28a0f0;
  --accent-ink:#031523;
  --connect-bg:#12131a;
  --connect-ink:#ffffff;
  --rail-active:#f3f4f6;
  --toggle-track:#e5e7eb;
  --shadow:0 4px 14px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.04);
  --radius-card:24px;
  --radius-field:16px;
  --radius-btn:12px;
  --font:"Geist","Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --maxw:1200px;
}
:root[data-theme="dark"]{
  --bg:#0f111b;
  --surface:#212330;
  --field:#272937;
  --field-hover:#2c2f40;
  --text:#f6f7fb;
  --muted:#9ca3af;
  --sub:#8a93a8;
  --edge:rgba(255,255,255,.06);
  --edge-2:rgba(255,255,255,.10);
  --accent:#12aaff;
  --accent-press:#28a0f0;
  --accent-ink:#031523;
  --connect-bg:#28a0f0;
  --connect-ink:#031523;
  --rail-active:#2b2e3d;
  --toggle-track:#3a3d4d;
  --shadow:0 12px 34px rgba(0,0,0,.42);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--font);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background .25s ease,color .25s ease;
}
a{color:inherit;text-decoration:none}
img,svg{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px}


.site-header{position:sticky;top:0;z-index:40;padding:10px 12px}
.header-bar{
  max-width:1360px;margin:0 auto;display:flex;align-items:center;gap:22px;height:60px;
  background:var(--surface);border:1px solid var(--edge);border-radius:18px;
  padding:0 16px;box-shadow:var(--shadow);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px;letter-spacing:-.01em}
.brand .logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(160deg,#56c4ff,#12aaff);display:grid;place-items:center;box-shadow:0 4px 12px rgba(18,170,255,.35)}
.nav-links{display:flex;align-items:center;gap:4px;margin:0 auto}
.nav-links a{display:inline-flex;align-items:center;gap:5px;color:var(--sub);font-weight:500;font-size:14.5px;padding:8px 12px;border-radius:10px;transition:color .15s,background .15s}
.nav-links a:hover{color:var(--text);background:var(--field)}
.nav-links a.active{color:var(--text)}
.nav-links .chev{opacity:.7}
.nav-actions{display:flex;align-items:center;gap:10px}
.icon-btn{width:40px;height:40px;border-radius:11px;border:1px solid var(--edge);background:var(--surface);display:grid;place-items:center;color:var(--sub);transition:border-color .15s,color .15s,background .15s}
.icon-btn:hover{color:var(--text);border-color:var(--edge-2)}
.btn-connect{height:38px;padding:0 16px;border-radius:var(--radius-btn);border:none;background:var(--connect-bg);color:var(--connect-ink);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;transition:transform .12s,filter .15s}
.btn-connect:hover{filter:brightness(1.05)}
.btn-connect:active{transform:translateY(1px)}
.menu-toggle{display:none}


.swap-main{display:flex;justify-content:center;padding:44px 16px 80px}
.swap-wrap{display:flex;align-items:flex-start;gap:12px}


.rail{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--edge);border-radius:20px;padding:8px;box-shadow:var(--shadow)}
.rail-tab{width:64px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border:none;background:transparent;border-radius:14px;color:var(--muted);font-size:11.5px;font-weight:500;transition:background .15s,color .15s}
.rail-tab svg{color:currentColor}
.rail-tab:hover{color:var(--text);background:var(--field)}
.rail-tab.active{background:var(--rail-active);color:var(--text)}


.card{width:436px;max-width:100%;background:var(--surface);border:1px solid var(--edge);border-radius:var(--radius-card);padding:20px;box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{display:flex;align-items:center;gap:8px;font-weight:600;font-size:18px}
.card-title .help{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:var(--muted);border:1px solid var(--edge-2);font-size:11px}
.gear{color:var(--muted);background:none;border:none;padding:6px;border-radius:9px;transition:color .15s,background .15s}
.gear:hover{color:var(--text);background:var(--field)}

.field-label{color:var(--sub);font-size:13px;margin:4px 2px 6px}
.field{background:var(--field);border:1px solid transparent;border-radius:var(--radius-field);padding:14px 14px;transition:border-color .15s,background .15s}
.field:focus-within{border-color:var(--edge-2)}
.field-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tk-btn{display:inline-flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--edge-2);border-radius:9999px;padding:6px 12px 6px 6px;font-weight:600;font-size:15px;color:var(--text);transition:border-color .15s,background .15s;white-space:nowrap}
.tk-btn:hover{border-color:var(--muted)}
:root[data-theme="dark"] .tk-btn{background:var(--field-hover)}
.tk-ic{width:28px;height:28px;border-radius:50%;overflow:hidden;background:var(--edge-2);display:grid;place-items:center;flex:0 0 auto}
.tk-ic img,.tk-ic svg{display:block;width:100%;height:100%;object-fit:contain;object-position:center}
.tk-ic.ph{color:var(--muted)}
.tk-btn .chev{color:var(--muted)}
.amount{background:none;border:none;outline:none;text-align:right;color:var(--text);font-size:26px;font-weight:500;width:100%;min-width:0;letter-spacing:-.01em}
.amount::placeholder{color:var(--muted)}
.balance{color:var(--muted);font-size:12.5px;margin:8px 2px 0}

.flip-wrap{display:flex;justify-content:center;height:0;position:relative;z-index:2}
.flip{width:38px;height:38px;margin-top:-9px;border-radius:12px;background:var(--surface);border:1px solid var(--edge-2);display:grid;place-items:center;color:var(--accent-ink);transition:transform .3s ease,border-color .15s}
:root[data-theme="dark"] .flip{color:var(--text)}
.flip:hover{border-color:var(--muted)}
.flip .g{color:#28a0f0}
:root[data-theme="dark"] .flip .g{color:var(--accent)}

.opt-row{display:flex;align-items:center;gap:10px;margin:16px 2px 4px}
.switch{width:38px;height:22px;border-radius:9999px;background:var(--toggle-track);border:none;padding:2px;display:inline-flex;align-items:center;transition:background .2s}
.switch .knob{width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.switch.on{background:var(--accent)}
.switch.on .knob{transform:translateX(16px)}
.opt-row label{color:var(--text);font-size:14px}

.cta{width:100%;height:48px;margin-top:16px;border:none;border-radius:var(--radius-btn);background:var(--edge-2);color:var(--muted);font-weight:600;font-size:15px;transition:background .18s,color .18s,filter .15s}
.cta.ready{background:var(--accent);color:var(--accent-ink)}
.cta.ready:hover{filter:brightness(1.03)}
.cta.ready:active{transform:translateY(1px)}


.modal-root{position:fixed;inset:0;z-index:80;display:none}
.modal-root.open{display:block}
.modal-bd{position:absolute;inset:0;background:rgba(10,12,20,.5);backdrop-filter:blur(4px)}
.modal-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100vw - 28px));max-height:calc(100vh - 60px);overflow:auto;background:var(--surface);border:1px solid var(--edge);border-radius:20px;padding:16px;box-shadow:0 30px 90px -20px rgba(0,0,0,.55)}
.modal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal-top h3{margin:0;font-size:17px;font-weight:600}
.modal-x{border:none;background:var(--field);color:var(--muted);width:32px;height:32px;border-radius:9px;display:grid;place-items:center}
.modal-x:hover{color:var(--text)}
.tk-search{width:100%;height:44px;border-radius:12px;border:1px solid var(--edge-2);background:var(--field);color:var(--text);padding:0 14px;font-size:14px;outline:none;margin-bottom:12px}
.tk-search::placeholder{color:var(--muted)}
.tk-list{display:flex;flex-direction:column;gap:2px}
.tk-opt{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:12px;cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:background .12s}
.tk-opt:hover{background:var(--field)}
.tk-opt .tk-ic{width:34px;height:34px}
.tk-opt .tk-meta{display:flex;flex-direction:column;line-height:1.2}
.tk-opt .tk-sym{font-weight:600;font-size:15px;color:var(--text)}
.tk-opt .tk-name{font-size:12.5px;color:var(--muted)}


@media (max-width:840px){
  .nav-links{display:none}
  .menu-toggle{display:grid}
}
@media (max-width:560px){
  .swap-wrap{flex-direction:column-reverse;align-items:center}
  .rail{flex-direction:row;width:100%;justify-content:center}
  .rail-tab{flex-direction:row;width:auto;padding:10px 14px}
  .card{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:root,:root[data-theme="dark"]{--bg:#070b12;--surface:#101925;--field:#0b1420;--field-hover:#192a3c;--text:#f1f6fc;--muted:#a5b3c4;--sub:#a5b3c4;--edge:#26384c;--edge-2:#354b63;--accent:#12aaff;--accent-ink:#031523;--rail-active:#15344e;--font:Inter,ui-sans-serif,system-ui,sans-serif}
:focus-visible{outline:2px solid #56c4ff;outline-offset:4px}body{background:radial-gradient(ellipse at 50% 35%,#112c453d,transparent 60%),var(--bg)}

.address-label{display:block;margin:20px 0 7px;font-size:13px;color:var(--sub)}.address{width:100%;background:var(--field);border:1px solid var(--edge-2);border-radius:12px;padding:13px;color:var(--text);font-size:14px}
.rail-tab{font-size:11px}.tk-opt{color:var(--text)}.empty{color:var(--muted);padding:16px}.swap-footer{text-align:center;color:var(--muted);font-size:13px;padding:0 20px 35px}.swap-footer a{color:#56c4ff}
@media(max-width:560px){.swap-wrap{flex-direction:column}.rail{width:100%}.card{width:100%;flex:auto;padding:16px}.header-bar{padding:0 12px}.brand{font-size:16px}.nav-actions a{font-size:12px}.amount{font-size:22px}.tk-btn{font-size:14px;padding-right:8px}.swap-main{padding-bottom:35px}}</style></head><body><header class="site-header"><div class="header-bar"><a href="/" class="brand" aria-label="Arbitrum Swap home"><span class="tk-ic brand-avatar"><img src="assets/arb.svg" alt=""></span>Arbitrum Swap</a><nav class="nav-links" aria-label="Primary"><a href="/swap/" class="active" aria-current="page">Swap</a><a href="/#how">How it works</a><a href="/#networks">Networks</a></nav><div class="nav-actions"><a href="/#faq">Help &amp; FAQ</a></div></div></header>
<main class="swap-main"><div class="swap-wrap"><aside class="rail" aria-label="Route type"><button class="rail-tab active" data-mode="cross" aria-pressed="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7h16m-4-4 4 4-4 4M20 17H4m4-4-4 4 4 4"/></svg>Cross-chain</button><button class="rail-tab" data-mode="arbitrum" aria-pressed="false"><span class="tk-ic rail-avatar"><img src="assets/arb.svg" alt=""></span>Arbitrum</button></aside>

<div class="field-label">You send</div><div class="field"><div class="field-row"><button class="tk-btn" data-select="send" aria-haspopup="dialog"><span class="tk-ic" data-ic="send"><img src="assets/arb.svg" alt=""></span><span><span data-sym="send">ARB</span><span class="tk-net" data-net="send">Arbitrum</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6"/></svg></button><input class="amount" id="sendAmount" type="text" inputmode="decimal" placeholder="0.00" aria-label="Amount to send" autocomplete="off"></div></div>

<div class="modal-root" id="tokenModal" aria-hidden="true"><div class="modal-bd" data-close></div><div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-top"><h3 id="modalTitle">Select token &amp; network</h3><button class="modal-x" data-close aria-label="Close token selector"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div><input class="tk-search" type="search" placeholder="Search token or network" aria-label="Search token or network"><div class="tk-list" id="tokenList"></div></div></div>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const tokens=[{sym:"ETH",name:"Ethereum",net:"Arbitrum",icon:"eth"},{sym:"ARB",name:"Arbitrum",net:"Arbitrum",icon:"arb"},{sym:"USDC",name:"USD Coin",net:"Arbitrum",icon:"usdc"},{sym:"USDT",name:"Tether",net:"Arbitrum",icon:"usdt"},{sym:"ETH",name:"Ethereum",net:"Ethereum",icon:"eth"},{sym:"USDC",name:"USD Coin",net:"Ethereum",icon:"usdc"},{sym:"USDT",name:"Tether",net:"Ethereum",icon:"usdt"},{sym:"BTC",name:"Bitcoin",net:"Bitcoin",icon:"btc"},{sym:"SOL",name:"Solana",net:"Solana",icon:"sol"},{sym:"BNB",name:"BNB",net:"BNB Chain",icon:"bnb"}];
let state={send:1,receive:5},mode="cross",activeSide="send",opener=null;
const modal=$("#tokenModal"),search=$(".tk-search");
function render(){["send","receive"].forEach(side=>{const t=tokens[state[side]];$('[data-ic="'+side+'"]').innerHTML='<img src="assets/'+t.icon+'.svg" alt="">';$('[data-sym="'+side+'"]').textContent=t.sym;$('[data-net="'+side+'"]').textContent=t.net});$("#addressNetwork").textContent="· "+tokens[state.receive].net;$("#receiveAddress").placeholder=["Arbitrum","Ethereum","BNB Chain"].includes(tokens[state.receive].net)?"0x… destination address":"Your "+tokens[state.receive].net+" address";update()}
function update(){const raw=$("#sendAmount").value.trim(),amount=Number(raw),valid=/^(?:\d+\.?\d*|\.\d+)$/.test(raw)&&Number.isFinite(amount)&&amount>0;$("#sendAmount").setAttribute("aria-invalid",String(raw!==""&&!valid));$("#cta").textContent=valid?"Swap":raw?"Enter a valid amount":"Enter an amount";$("#cta").disabled=true}
function list(){const q=search.value.trim().toLowerCase(),result=tokens.map((t,i)=>({t,i})).filter(({t})=>(mode!=="arbitrum"||t.net==="Arbitrum")&&(t.sym+" "+t.name+" "+t.net).toLowerCase().includes(q));$("#tokenList").innerHTML=result.length?result.map(({t,i})=>'<button class="tk-opt" data-pick="'+i+'"><span class="tk-ic"><img src="assets/'+t.icon+'.svg" alt=""></span><span class="tk-meta"><span class="tk-sym">'+t.sym+'</span><span class="tk-name">'+t.name+' · '+t.net+'</span></span></button>').join(""):'<p class="empty" role="status">No matching assets. Try a token symbol or network name.</p>'}
function close(){modal.classList.remove("open");modal.setAttribute("aria-hidden","true");document.body.style.overflow="";document.querySelectorAll("header,main,footer").forEach(el=>el.inert=false);if(opener)opener.focus()}
$$("[data-select]").forEach(b=>b.addEventListener("click",()=>{opener=b;activeSide=b.dataset.select;search.value="";list();modal.classList.add("open");modal.setAttribute("aria-hidden","false");document.body.style.overflow="hidden";document.querySelectorAll("header,main,footer").forEach(el=>el.inert=true);search.focus()}));
$$("[data-close]").forEach(b=>b.addEventListener("click",close));search.addEventListener("input",list);
modal.addEventListener("click",e=>{const b=e.target.closest("[data-pick]");if(!b)return;const other=activeSide==="send"?"receive":"send",index=Number(b.dataset.pick);if(state[other]===index)state[other]=state[activeSide];state[activeSide]=index;$("#receiveAddress").value="";render();close()});
document.addEventListener("keydown",e=>{if(!modal.classList.contains("open"))return;if(e.key==="Escape")close();if(e.key==="Tab"){const f=Array.from(modal.querySelectorAll("button,input")),first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
$("#flipBtn").addEventListener("click",()=>{[state.send,state.receive]=[state.receive,state.send];$("#sendAmount").value="";$("#receiveAddress").value="";render()});$("#sendAmount").addEventListener("input",update);
$$("[data-mode]").forEach(b=>b.addEventListener("click",()=>{mode=b.dataset.mode;$$("[data-mode]").forEach(t=>{t.classList.toggle("active",t===b);t.setAttribute("aria-pressed",String(t===b))});state=mode==="arbitrum"?{send:1,receive:2}:{send:1,receive:5};$("#receiveAddress").value="";render()}));render();
